<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=privacy-policy/">
  <title>Państwa Miasta - polityka prywatności</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f7f4;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #5f6368;
      --accent: #2457c5;
      --border: #deded8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111214;
        --surface: #1b1c1f;
        --text: #f5f5f5;
        --muted: #b8b8b8;
        --accent: #8ab4ff;
        --border: #303236;
      }
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Państwa Miasta</h1>
      <p>Przekierowujemy do polityki prywatności aplikacji.</p>
      <p><a href="privacy-policy/">Otwórz politykę prywatności</a></p>
    </section>
  </main>
</body>
</html>
