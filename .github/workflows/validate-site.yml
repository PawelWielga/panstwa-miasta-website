name: Verify deployed GitHub Pages

on:
  push:
    branches:
      - feature/initial-landing-page

permissions:
  contents: write

jobs:
  verify-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for and verify GitHub Pages
        shell: bash
        run: |
          set -euo pipefail

          site_url="https://pawelwielga.github.io/panstwa-miasta-website/"
          privacy_url="https://pawelwielga.github.io/panstwa-miasta-website/privacy-policy/"

          success=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "$site_url" --output /tmp/site.html \
              && grep --quiet "Państwa Miasta" /tmp/site.html \
              && grep --quiet "Bez kartek i liczenia punktów" /tmp/site.html \
              && curl --fail --silent --show-error --location "$privacy_url" --output /tmp/privacy.html \
              && grep --quiet "Polityka prywatności" /tmp/privacy.html; then
              success=true
              break
            fi
            sleep 10
          done

          if [ "$success" != true ]; then
            echo "GitHub Pages did not expose the expected landing page in time." >&2
            exit 1
          fi

          printf 'status=success\nchecked_at=%s\nsite=%s\nprivacy_policy=%s\n' \
            "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            "$site_url" \
            "$privacy_url" > deployment-check.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-check.txt
          git commit -m "chore: confirm GitHub Pages deployment"
          git push origin HEAD:feature/initial-landing-page
